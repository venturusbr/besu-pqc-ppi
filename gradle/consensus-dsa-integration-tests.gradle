/*
 * Runs a consensus project's integration tests under signature algorithms other than SECP256K1.
 * The project registers ActiveDsaExtension in its integration-test resources; the extension reads
 * the algorithm from the system property set here and makes node keys follow it.
 *
 *   ./gradlew :consensus:qbft-core:integrationTestPqc                     every algorithm below
 *   ./gradlew :consensus:qbft-core:integrationTestFALCON512               a single one
 *   ./gradlew :consensus:qbft-core:integrationTest -PconsensusTestDsa=X   any --node-dsa name
 *
 * The plain integrationTest task still runs under SECP256K1 unless consensusTestDsa is given.
 */

def dsaProperty = 'besu.consensus.test.dsa'
def algorithms = ['MLDSA44', 'SECP256K1-MLDSA44', 'FALCON512', 'SECP256K1-FALCON512']

integrationTest {
  systemProperty dsaProperty, findProperty('consensusTestDsa') ?: ''
}

def algorithmTasks = algorithms.collect { dsa ->
  tasks.register("integrationTest${dsa.replace('-', '')}", Test) {
    group = 'verification'
    description = "Runs the integration tests under ${dsa}"
    dependsOn 'compileTestJava'
    jvmArgs = integrationTest.jvmArgs
    testClassesDirs = integrationTest.testClassesDirs
    classpath = integrationTest.classpath
    outputs.upToDateWhen { false }
    useJUnitPlatform {}
    systemProperty dsaProperty, dsa
  }
}

tasks.register('integrationTestPqc') {
  group = 'verification'
  description = 'Runs the integration tests under every post-quantum and hybrid signature algorithm'
  dependsOn algorithmTasks
}
