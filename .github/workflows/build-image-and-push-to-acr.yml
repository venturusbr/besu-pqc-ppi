name: Build Docker Image and Push to ACR

on:
  push:
    tags:
      - 'img-*'

permissions:
  id-token: write
  contents: read

env:
  REPO: venturusbr/besu-pqc-ppi

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: acr
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Read the release version and set the image tag
        id: vars
        run: |
          set -euo pipefail
          RELEASE_VERSION="$(sed -n 's/^version=//p' gradle.properties)"
          TAG_NAME="${GITHUB_REF#refs/tags/img-}"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${RELEASE_VERSION}-${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The registry name is a secret so that it is masked in the logs of this public repository
      - name: Log in to Azure Container Registry using az CLI
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"

      - name: Build Docker image
        run: |
          set -euo pipefail
          ./gradlew -Prelease.releaseVersion=${{ steps.vars.outputs.RELEASE_VERSION }} distDocker

      - name: Tag Docker image for ACR
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: |
          set -euo pipefail
          ACR_SERVER="$ACR_NAME.azurecr.io"
          IMAGE_TAG="${{ steps.vars.outputs.IMAGE_TAG }}"
          BASE_TAG="${{ steps.vars.outputs.RELEASE_VERSION }}"
          docker tag hyperledger/besu:$BASE_TAG $ACR_SERVER/$REPO:$IMAGE_TAG
          docker tag hyperledger/besu:$BASE_TAG $ACR_SERVER/$REPO:latest
          echo "ACR_IMAGE_VERSIONED=$ACR_SERVER/$REPO:$IMAGE_TAG" >> $GITHUB_ENV
          echo "ACR_IMAGE_LATEST=$ACR_SERVER/$REPO:latest" >> $GITHUB_ENV

      - name: Push Docker images to ACR
        run: |
          set -euo pipefail
          docker push $ACR_IMAGE_VERSIONED
          docker push $ACR_IMAGE_LATEST

      - name: Log out of Azure
        run: az logout
        if: always()
