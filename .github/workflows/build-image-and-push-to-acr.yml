name: Test Azure OIDC Login

on:
  push:
    tags:
      - 'img*'

permissions:
  id-token: write
  contents: read

env:
  DOCKER_VARIANTS: openjdk-17
  RELEASE_VERSION: 24.1.x-pqc

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # fetch all tags
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'

      - name: Extract tag name and set image tag
        id: vars
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/img-}"
          IMAGE_TAG="${RELEASE_VERSION}-${DOCKER_VARIANTS}-${TAG_NAME}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # - name: Docker login to ACR via Azure CLI token
      #   run: az acr login --name ${{ secrets.ACR_NAME }}
        # az acr login caches an Entra token in docker config :contentReference[oaicite:6]{index=6}
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_TOKEN_USERNAME }}
          password: ${{ secrets.ACR_TOKEN_PASSWORD }}

      - name: Build Docker image
        run: |
          ./gradlew -PdockerVariants=${{ env.DOCKER_VARIANTS }} -Prelease.releaseVersion=${{ env.RELEASE_VERSION }} distDocker

      - name: Tag Docker image for ACR
        run: |
          IMAGE_TAG="${{ steps.vars.outputs.IMAGE_TAG }}"
          ACR_SERVER="${{ secrets.ACR_LOGIN_SERVER }}"
          docker tag hyperledger/besu:24.1.x-pqc-openjdk-17 $ACR_SERVER/hyperledger/besu:$IMAGE_TAG
          docker tag hyperledger/besu:24.1.x-pqc-openjdk-17 $ACR_SERVER/hyperledger/besu:latest
          echo "ACR_IMAGE_VERSIONED=$ACR_SERVER/hyperledger/besu:$IMAGE_TAG" >> $GITHUB_ENV
          echo "ACR_IMAGE_LATEST=$ACR_SERVER/hyperledger/besu:latest" >> $GITHUB_ENV

      - name: Push Docker images to ACR
        run: |
          docker push $ACR_IMAGE_VERSIONED
          docker push $ACR_IMAGE_LATEST
